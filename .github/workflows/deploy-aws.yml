name: Deploy to AWS

# Mirrors Render's auto-deploy (see project memory) for the AWS EC2 box —
# SSHes in and rebuilds the docker-compose stack (api/web/caddy) on every
# push to main. Requires these repo secrets (Settings -> Secrets and
# variables -> Actions):
#   AWS_SSH_HOST    - the EC2 Elastic IP (e.g. 3.139.241.196)
#   AWS_SSH_USER    - SSH user (ubuntu)
#   AWS_SSH_KEY     - contents of the .pem private key
#   AWS_DEPLOY_PATH - absolute path to the repo clone on the box
#                     (e.g. /home/ubuntu/veerox-)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_SSH_HOST }}
          username: ${{ secrets.AWS_SSH_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script_stop: true
          script: |
            cd ${{ secrets.AWS_DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            # Explicit -f is required: the repo also has a compose.yml
            # (local-dev-only: api+db+redis, no caddy/web) alongside this
            # docker-compose.yml (the real prod stack: api+web+caddy) — a
            # bare `docker compose` picks compose.yml by Compose v2's file
            # precedence, silently rebuilding the wrong stack.
            docker compose -f docker-compose.yml build
            # Migrate BEFORE swapping containers, in a one-off container built
            # from the NEW image (--no-deps: no other service is touched). The
            # schema changes are additive, so the old containers keep serving
            # the old code against the migrated database; and if the migration
            # fails, script_stop aborts here and the old containers stay up
            # on the old code. Previously `up -d` came first, which left every
            # query that used a new column failing until `alembic upgrade head`
            # finished (or forever, if it failed).
            docker compose -f docker-compose.yml run --rm --no-deps api alembic upgrade head
            docker compose -f docker-compose.yml up -d
            docker image prune -f
