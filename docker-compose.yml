services:
  api:
    image: veerox-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Workers live in the `worker` container below, not on the API's event loop.
      RUN_BACKGROUND_WORKERS: "false"
    restart: unless-stopped
    expose:
      - "8002"
    # Restart on hangs, not just crashes. /health is process-only so a DB blip doesn't restart-loop the API.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s

  # Same image as api, running only the background workers. Exactly one replica: the workers claim rows
  # with SKIP LOCKED but the in-process schedulers are not designed for several copies.
  worker:
    image: veerox-api:latest
    command: ["python", "-m", "apps.api.worker_main"]
    env_file: .env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    expose:
      - "3001"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
