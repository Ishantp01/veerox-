[project]
name = "veerox-core"
version = "0.1.0"
description = "Veerox AI — Voice + WhatsApp Agent backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "redis",
    "httpx",
    "websockets",
    "slowapi",
    "structlog",
    "orjson",
    "sentry-sdk[fastapi]",
    "openai>=1.50",
    "tiktoken",
    "tenacity",
    "psycopg2-binary>=2.9.12",
    "python-multipart",
    "openpyxl",
    "argon2-cffi",
    "email-validator",
    "tzdata",
    "cryptography",
    "boto3",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "respx",
    "aiosqlite",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
# Use ruff's default formatting settings.

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# No official type stubs are published for openpyxl.
module = "openpyxl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# boto3 is a real dependency (see workers/aws_cost_importer.py), but its
# calls are gated behind settings.aws_cost_import_enabled at runtime — no
# official type stubs are published (boto3-stubs is a separate opt-in
# package this project doesn't pull in), so this stays lenient.
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Channel adapters talk to third-party SDKs whose stubs are absent; keep lenient.
module = "apps.api.channels.*"
ignore_errors = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# apps.api.core.* inherits the top-level strict = true — no override needed.
# This entry is explicit for documentation clarity only.
module = "apps.api.core.*"
strict = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
